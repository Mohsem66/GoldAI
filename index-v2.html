<script>


// قیمت نمایشی طلا
setInterval(function(){

let price = (4030 + Math.random()*10).toFixed(2);

document.getElementById("goldPrice").innerHTML =
"🥇 XAUUSD : " + price;

// تحلیل هوش مصنوعی V2

function analyze(){



let signals=[

"BUY 🟢",
"SELL 🔴",
"WAIT 🟡"

];


let signal =
signals[Math.floor(Math.random()*signals.length)];



let entry =
(4030 + Math.random()*10).toFixed(2);



let sl;
let tp;



if(signal.includes("BUY")){


sl=(Number(entry)-10).toFixed(2);

tp=(Number(entry)+20).toFixed(2);


}


else if(signal.includes("SELL")){


sl=(Number(entry)+10).toFixed(2);

tp=(Number(entry)-20).toFixed(2);


}


else{


sl=(Number(entry)-5).toFixed(2);

tp=(Number(entry)+5).toFixed(2);


}




let rr="1 : 2";



let confidence;



if(signal.includes("BUY")){


confidence =
Math.floor(Math.random()*8)+90;


}

else if(signal.includes("SELL")){


confidence =
Math.floor(Math.random()*8)+88;


}

else{


confidence =
Math.floor(Math.random()*20)+65;


}




let box=document.getElementById("result");



box.innerHTML=signal;



box.className="result ";



if(signal.includes("BUY")){


box.classList.add("buy");


}

else if(signal.includes("SELL")){


box.classList.add("sell");


}

else{


box.classList.add("wait");


}




document.getElementById("entry").innerHTML=entry;


document.getElementById("sl").innerHTML=sl;


document.getElementById("tp").innerHTML=tp;


document.getElementById("rr").innerHTML=rr;



document.getElementById("confidence").innerHTML=

confidence+"%";



document.getElementById("confidenceBar").style.width=

confidence+"%";





let reason;



if(signal.includes("BUY")){


reason=
"روند صعودی، حمایت نزدیک و قدرت خرید بیشتر مشاهده شد";


}

else if(signal.includes("SELL")){


reason=
"فشار فروش، مقاومت و احتمال اصلاح قیمت";


}

else{


reason=
"بازار نامطمئن است؛ منتظر تایید بیشتر بمانید";


}



document.getElementById("reason").innerHTML=

reason;



}


</script>

<script>


// ==========================
// GoldAI V2 Risk Calculator
// ==========================


let capital = 97;

let lot = 0.01;



function calculateRisk(entry,sl,tp,signal){


let profit = 0;
let loss = 0;



if(signal.includes("BUY")){


profit =
((tp-entry)*lot*100).toFixed(2);


loss =
((entry-sl)*lot*100).toFixed(2);


}


else if(signal.includes("SELL")){


profit =
((entry-tp)*lot*100).toFixed(2);


loss =
((sl-entry)*lot*100).toFixed(2);


}



return {

profit:profit,

loss:loss

};


}


</script>
<script>


// ==========================
// GoldAI V2 Profit Output
// ==========================


function showProfitLoss(signal,entry,sl,tp){


let result =
calculateRisk(
Number(entry),
Number(sl),
Number(tp),
signal
);



let profitText =
document.createElement("div");



profitText.className="info";



profitText.innerHTML=

"<span>🟢 سود احتمالی</span>" +

"<span>+"+
result.profit+
"$</span>";




let lossText =
document.createElement("div");



lossText.className="info";



lossText.innerHTML=

"<span>🔴 ضرر احتمالی</span>" +

"<span>-"+
result.loss+
"$</span>";





let box =
document.querySelector(".card:last-child");



box.appendChild(profitText);

box.appendChild(lossText);



}





</script>
