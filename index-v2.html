<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GoldAI V2</title>


<style>

body{

margin:0;
background:#070b14;
color:white;
font-family:tahoma,Arial;

}


.container{

width:92%;
max-width:520px;
margin:20px auto;

}



.card{

background:#151c2b;
padding:18px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 0 15px #000;

}



h1{

text-align:center;
color:#ffd700;

}



.price{

text-align:center;
font-size:28px;
color:#00ff99;

}



button{

width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#ffd700;
font-size:18px;
font-weight:bold;
cursor:pointer;

}



button:active{

transform:scale(.98);

}



.result{

text-align:center;
padding:18px;
border-radius:15px;
font-size:24px;
font-weight:bold;

}



.buy{

background:#064d25;

}



.sell{

background:#650000;

}



.wait{

background:#665000;

}



.info{

display:flex;
justify-content:space-between;
background:#20283a;
padding:10px;
border-radius:10px;
margin:8px 0;

}



.title{

color:#ffd700;
font-size:18px;

}



.bar{

height:20px;
background:#333;
border-radius:20px;
overflow:hidden;

}



.progress{

height:100%;
width:0%;
background:#00ff88;
transition:1s;

}



.small{

font-size:13px;
color:#aaa;

}



.green{

color:#00ff88;

}



.red{

color:#ff5555;

}



</style>

</head>


<body>


<div class="container">


<div class="card">

<h1>

🥇 GoldAI V2

</h1>


<div class="price" id="goldPrice">

XAUUSD : Loading...

</div>


</div>



<div class="card">


<button onclick="analyze()">

🤖 شروع تحلیل هوش مصنوعی

</button>


</div>



<div class="card">


<div id="signalBox" class="result wait">

⏳ منتظر تحلیل

</div>


</div>



<div class="card">


<div class="title">

📊 معامله پیشنهادی

</div>



<div class="info">

<span>

Entry

</span>

<span id="entry">

-

</span>

</div>



<div class="info">

<span>

Stop Loss

</span>

<span id="sl">

-

</span>

</div>



<div class="info">

<span>

Take Profit

</span>

<span id="tp">

-

</span>

</div>



<div class="info">

<span>

Risk Reward

</span>

<span id="rr">

-

</span>

</div>


</div>



<div class="card">


<div class="title">

🧠 AI Confidence

</div>


<br>


<div class="bar">

<div id="confidenceBar" class="progress">

</div>

</div>


<h3 id="confidence">

-

</h3>


</div>



<div class="card">


<div class="title">

💰 مدیریت سرمایه

</div>



<div class="info">

<span>

Capital

</span>

<span id="capital">

97$

</span>

</div>



<div class="info">

<span>

Lot

</span>

<span id="lot">

0.01

</span>

</div>


<div class="info">

<span>

Profit

</span>

<span id="profit" class="green">

-

</span>

</div>



<div class="info">

<span>

Loss

</span>

<span id="loss" class="red">

-

</span>

</div>


</div>
