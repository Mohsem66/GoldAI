<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoldAI Pro</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .header-actions{display:flex;gap:8px;align-items:center}
    .manual-price-row{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
    .manual-price-input{width:140px;padding:8px 12px;border-radius:10px;border:1px solid var(--line,#333);background:var(--bg,#111);color:var(--text,#eee);font-size:14px;direction:ltr;text-align:center}
    .btn-sm{padding:6px 12px!important;font-size:12px!important;margin:0!important}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:9998;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-sheet{background:var(--card,#1a1a22);border:1px solid var(--line,#333);border-radius:16px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:20px}
    .modal-sheet h3{margin:0 0 16px;display:flex;align-items:center;justify-content:space-between}
    .settings-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .settings-modal-grid .full{grid-column:1/-1}
    .settings-modal-grid label{display:block;font-size:12px;opacity:.7;margin-bottom:4px}
    .settings-modal-grid input,.settings-modal-grid select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line,#333);background:var(--bg,#111);color:var(--text,#eee)}
    .modal-actions{display:flex;gap:10px;margin-top:18px}
    .modal-actions button{flex:1}
    .hidden{display:none!important}
    @media(max-width:480px){.settings-modal-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <h1>🥇 GoldAI Pro</h1>
        <div class="header-actions">
          <button id="settingsBtn" class="btn-icon" onclick="GoldAI.openSettingsModal()" title="تنظیمات">⚙️</button>
          <button id="themeToggle" class="btn-icon" onclick="GoldAI.toggleTheme()">🌙</button>
        </div>
      </div>
      <div class="symbol-price-center">
        <div class="symbol-selector">
          <select id="symbolSelect" onchange="GoldAI.changeSymbol()">
            <option value="XAU/USD">🥇 XAU/USD</option>
            <option value="EUR/USD">🇪🇺 EUR/USD</option>
            <option value="GBP/USD">🇬🇧 GBP/USD</option>
            <option value="USD/JPY">🇯🇵 USD/JPY</option>
            <option value="AUD/USD">🇦🇺 AUD/USD</option>
            <option value="USD/CAD">🇨🇦 USD/CAD</option>
            <option value="GBP/JPY">🇬🇧🇯🇵 GBP/JPY</option>
            <option value="EUR/JPY">🇪🇺🇯🇵 EUR/JPY</option>
          </select>
        </div>
        <div class="price-big" id="goldPrice">—</div>
        <div class="manual-price-row">
          <input type="number" id="manualEntryInput" class="manual-price-input" placeholder="قیمت دستی..." step="any" inputmode="decimal" />
          <button class="btn-ghost btn-sm" onclick="GoldAI.applyManualPrice()">اعمال</button>
          <button class="btn-ghost btn-sm" onclick="GoldAI.refreshPrice()" title="قیمت آنلاین">🔄</button>
        </div>
        <div class="market-badge">
          <span class="market-status" id="marketStatus">—</span>
          <span class="session" id="marketSession">—</span>
          <span class="data-mode" id="dataModeBadge" title="منبع داده">DEMO</span>
        </div>
      </div>
      <div id="marketClosedWarning" class="market-warning hidden">⛔ بازار بسته است</div>
      <div id="timeDisplay" class="time-display">
        <div class="date-row" id="persianDate">—</div>
        <div class="clocks" id="clocksContainer">
          <span><b>تهران</b> —</span><span><b>لندن</b> —</span>
          <span><b>نیویورک</b> —</span><span><b>توکیو</b> —</span>
        </div>
      </div>
    </header>

    <div id="panel-home" class="panel">
      <div class="card signal-card">
        <div id="signal" class="signal-value wait">WAIT 🟡</div>
        <div class="strength-bar">
          <span>ضعیف</span>
          <div class="bar-track"><div id="signalStrengthBar" style="width:0%;"></div></div>
          <span>قوی</span>
          <span id="signalStrengthText" class="strength-text">0%</span>
        </div>
        <div class="signal-details" id="signalDetails"></div>
        <div id="warnings" class="warnings"></div>
        <div class="signal-actions">
          <button class="btn-ghost" onclick="GoldAI.shareSignal()">📤 اشتراک / Signal Swift</button>
        </div>
      </div>

      <button id="analyzeBtn" class="btn-main" onclick="GoldAI.analyze()">▶ شروع تحلیل AI</button>

      <div id="hiddenSettingsStore" class="hidden" aria-hidden="true">
        <input type="number" id="advCapital" value="10000" />
        <input type="number" id="advRisk" value="1" />
        <select id="userTpCount"><option value="3" selected>3</option></select>
        <input type="number" id="userLot" value="0" />
        <input type="number" id="userSlMult" value="1.5" />
        <input type="number" id="userTp1Mult" value="2.0" />
        <input type="number" id="userTp2Mult" value="3.5" />
        <input type="number" id="userTp3Mult" value="5.0" />
        <select id="strategySelect"><option value="scalp">scalp</option><option value="swing">swing</option></select>
      </div>

      <div class="card risk-card">
        <div class="risk-header"><h3>💰 ریسک و عملکرد</h3></div>
        <div class="risk-main-row">
          <div class="risk-item"><span>سرمایه</span><b id="capitalText">10000</b></div>
          <div class="risk-item"><span>ریسک</span><b id="riskText">1%</b></div>
          <div class="risk-item"><span>حد ضرر ($)</span><b id="maxLossText">100</b></div>
          <div class="risk-item"><span>لات</span><b id="lotText">0.01</b></div>
        </div>
      </div>
    </div>

    <div id="panel-details" class="panel hidden">
      <div class="card"><h3>📊 جزئیات</h3><div class="detail-grid">
        <div class="detail-row"><span>EMA20</span><span id="dEma20">—</span></div>
        <div class="detail-row"><span>RSI</span><span id="dRsi">—</span></div>
        <div class="detail-row"><span>Structure</span><span id="dStruct">—</span></div>
      </div></div>
    </div>
    <div id="panel-performance" class="panel hidden">
      <div class="card"><button class="btn-ghost" onclick="GoldAI.runBacktest()">📊 بک‌تست</button></div>
    </div>
    <div id="panel-about" class="panel hidden">
      <div class="card"><h3>ℹ️ درباره</h3><p>آموزشی — مشاوره مالی نیست.</p></div>
    </div>

    <nav class="nav">
      <button class="nav-btn active" data-panel="home" onclick="GoldAI.showPanel('home')">🏠</button>
      <button class="nav-btn" data-panel="details" onclick="GoldAI.showPanel('details')">📊</button>
      <button class="nav-btn" data-panel="performance" onclick="GoldAI.showPanel('performance')">📈</button>
      <button class="nav-btn" data-panel="about" onclick="GoldAI.showPanel('about')">ℹ️</button>
    </nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/ema.js"></script>
  <script src="js/engines/rsi.js"></script>
  <script src="js/engines/divergence.js"></script>
  <script src="js/engines/market-structure.js"></script>
  <script src="js/engines/macd.js"></script>
  <script src="js/engines/adx.js"></script>
  <script src="js/engines/atr.js"></script>
  <script src="js/engines/volume.js"></script>
  <script src="js/engines/support-resistance.js"></script>
  <script src="js/engines/candles.js"></script>
  <script src="js/engines/liquidity.js"></script>
  <script src="js/engines/fundamental.js"></script>
  <script src="js/engines/correlation.js"></script>
  <script src="js/engines/ai-brain.js"></script>
  <script src="js/engines/score.js"></script>
  <script src="js/engines/conflict-filter.js"></script>
  <script src="js/engines/trade-management.js"></script>
  <script src="js/engines/backtest.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui-extras.js"></script>
  <script src="js/speed-patch.js"></script>
</body>
</html>
