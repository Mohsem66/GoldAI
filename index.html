<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GoldAI</title>

<style>
body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#111;
color:white;
text-align:center;
}

h1{
color:#FFD700;
}

.box{
background:#222;
margin:20px auto;
padding:20px;
border-radius:15px;
max-width:400px;
}

button{
background:#FFD700;
color:#000;
border:none;
padding:15px 30px;
font-size:18px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#ffea4d;
}

#result{
margin-top:20px;
font-size:18px;
line-height:1.8;
}
</style>

</head>

<body>

<h1>GoldAI</h1>
<div class="box">
<h2>🥇 XAUUSD</h2>
<p style="font-size:24px;color:#FFD700;">
Price : Loading...
</p>
</div>
<div class="box">
<h2>🤖 AI STATUS</h2>
<p id="status">🟢 Ready</p>
</div>
<div class="box">
<h2>XAUUSD</h2>
<p>AI Gold Analysis</p>
<p>Timeframe: M1 + M5</p>
<p>M15 Trend Filter: Active</p>
</div>

<div class="box">
<h2>Risk Manager</h2>
<p>Small Account Mode: ON</p>
<p>Max Trades: 3 / Day</p>
</div>

<div class="box">

<button id="analyzeBtn" onclick="analyze()">
Start AI Analysis
</button>

<div id="result"></div>
<script>
setInterval(function(){

document.getElementById("goldPrice").innerHTML =
"🥇 XAUUSD : " + (4030 + Math.random()*10).toFixed(2);

},1000);
function analyze(){

document.getElementById("status").innerHTML="🟡 Analyzing...";
document.getElementById("result").innerHTML = `
<h3>📈 GoldAI Signal</h3>

<p><b>Signal:</b>
<span style="color:#00ff66;font-size:22px;">
<span style="color:#00ff66;font-size:22px;"><b>BUY 🟢</b></span>
</span>
</p>
p><b>Entry:</b> 4035</p>

<p><b>Stop Loss:</b>
<span style="color:#ff4444;">4025</span>
</p>

<p><b>Take Profit:</b>
<span style="color:#00ff66;">4055</span>
</p>

<p><b>Risk / Reward:</b> 1 : 2</p>
<p><b>AI Confidence:</b> 92%</p>
<p style="color:#00ff66;">
Status: Waiting for confirmation
<br><br>
<b>🤖 AI Confidence</b><br>
█████████░ 92%
</p>
`;

}
</script>

</div>

</body>
</html>
