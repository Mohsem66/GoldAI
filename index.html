<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldAI</title>

<style>
body{
    font-family: Arial;
    direction: rtl;
    background:#111;
    color:white;
    text-align:center;
}
.box{
    background:#222;
    margin:20px;
    padding:20px;
    border-radius:15px;
}
h1{
    color:#ffd700;
}
button{
    background:#ffd700;
    border:0;
    padding:15px 30px;
    border-radius:10px;
    font-size:18px;
}
</style>

</head>

<body>

<h1>GoldAI</h1>

<div class="box">
<h2>XAUUSD</h2>
<p>AI Gold Analysis</p>
<p>Timeframe: M1 + M5</p>
<p>M15 Trend Filter: Active</p>
</div>

<div class="box">
<h2>Risk Manager</h2>
<p>Small Account Mode: ON</p>
<p>Max Trades: 3 / Day</p>
</div>

<div class="box">
<button onclick="analyze()">
    Start AI Analysis
</button>

<div id="result" style="margin-top:20px;font-size:18px;"></div>

<script>
function analyze(){
document.getElementById("result").innerHTML =
""📈 GoldAI Signal<br><br>"+
"Signal: BUY 🟢<br>"+
"Entry: 4035<br>"+
"Stop Loss: 4025<br>"+
"Take Profit: 4055<br>"+
"Risk/Reward: 1:2<br><br>"+
"Status: Waiting for confirmation";
}
</script>
</div>

</body>
</html>
