<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GoldAI</title>

<style>
body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#111;
color:white;
text-align:center;
}

h1{
color:#FFD700;
}

.box{
background:#222;
margin:20px auto;
padding:20px;
border-radius:15px;
max-width:400px;
}

button{
background:#FFD700;
color:#000;
border:none;
padding:15px 30px;
font-size:18px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#ffea4d;
}

#result{
margin-top:20px;
font-size:18px;
line-height:1.8;
}
</style>

</head>

<body>

<h1>GoldAI</h1>
<div class="box">
<h2>🤖 AI STATUS</h2>
<p id="status">🟢 Ready</p>
</div>
<div class="box">
<h2>XAUUSD</h2>
<p>AI Gold Analysis</p>
<p>Timeframe: M1 + M5</p>
<p>M15 Trend Filter: Active</p>
</div>

<div class="box">
<h2>Risk Manager</h2>
<p>Small Account Mode: ON</p>
<p>Max Trades: 3 / Day</p>
</div>

<div class="box">

<button onclick="analyze()">
Start AI Analysis
</button>

<div id="result"></div>
<script>
function analyze(){

document.getElementById("result").innerHTML = `
<h3>📈 GoldAI Signal</h3>

<p><b>Signal:</b> BUY 🟢</p>

<p><b>Entry:</b> 4035</p>

<p><b>Stop Loss:</b> 4025</p>

<p><b>Take Profit:</b> 4055</p>

<p><b>Risk / Reward:</b> 1 : 2</p>

<p style="color:#00ff66;">
Status: Waiting for confirmation
</p>
`;

}
</script>

</div>

</body>
</html>
