<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoldAI Pro</title>
  <!-- فونت وزیرمتن از CDN -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>🥇 GoldAI Pro</h1>
        <div>
          <button id="themeToggle" class="btn-icon" onclick="GoldAI.toggleTheme()">🌙</button>
        </div>
      </div>
      <div class="price-row">
        <span class="price-big" id="goldPrice">—</span>
        <span class="market-status" id="marketStatus">—</span>
      </div>
      <div id="timeDisplay" style="margin-top: 6px; font-size: 13px; color: var(--muted);"></div>
    </header>

    <!-- ===== PANEL HOME ===== -->
    <div id="panel-home" class="panel">

      <!-- کارت سیگنال -->
      <div class="card signal-card">
        <div id="signal" class="signal-value wait">WAIT 🟡</div>
        <div style="margin: 6px 0 10px;">
          <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted);">
            <span>ضعیف</span>
            <span>قدرت: <span id="signalStrengthText">0%</span></span>
            <span>قوی</span>
          </div>
          <div style="width:100%; height:8px; background:#1a222c; border-radius:4px; overflow:hidden;">
            <div id="signalStrengthBar" style="width:0%; height:100%; background:var(--gold); border-radius:4px; transition: width 0.5s ease;"></div>
          </div>
        </div>
        <div class="signal-details" id="signalDetails">
          <!-- این بخش به‌صورت پویا توسط جاوااسکریپت پر می‌شود -->
        </div>
        <div class="reason-box" id="aiReason" style="font-size:13px; margin-top:8px;">—</div>
        <div id="warnings" style="font-size:12px; color:var(--muted); margin-top:4px;"></div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn-ghost" style="flex:1;" onclick="GoldAI.copySignal()">📋 کپی</button>
          <button class="btn-ghost" style="flex:1;" onclick="GoldAI.shareSignal()">📤 اشتراک</button>
        </div>
      </div>

      <!-- دکمه تحلیل -->
      <button id="analyzeBtn" class="btn-main" onclick="GoldAI.analyze()">▶ شروع تحلیل AI</button>

      <!-- کارت تنظیمات پیشرفته معامله -->
      <div class="card trade-settings-card">
        <h3>⚙️ تنظیمات معامله</h3>
        <div class="settings-grid">
          <div>
            <label>تعداد TP</label>
            <select id="userTpCount" onchange="GoldAI.updateTradeSettings()">
              <option value="1">۱</option>
              <option value="2">۲</option>
              <option value="3" selected>۳</option>
            </select>
          </div>
          <div>
            <label>ضریب SL (ATR)</label>
            <input type="number" id="userSlMult" value="1.5" step="0.1" min="0.5" max="5" oninput="GoldAI.updateTradeSettings()" />
          </div>
          <div>
            <label>ضریب TP1</label>
            <input type="number" id="userTp1Mult" value="2.0" step="0.1" min="0.5" max="10" oninput="GoldAI.updateTradeSettings()" />
          </div>
          <div>
            <label>ضریب TP2</label>
            <input type="number" id="userTp2Mult" value="3.5" step="0.1" min="0.5" max="15" oninput="GoldAI.updateTradeSettings()" />
          </div>
          <div>
            <label>ضریب TP3</label>
            <input type="number" id="userTp3Mult" value="5.0" step="0.1" min="0.5" max="20" oninput="GoldAI.updateTradeSettings()" />
          </div>
          <div>
            <label>لات دستی (۰=خودکار)</label>
            <input type="number" id="userLot" value="0" step="0.01" min="0" max="10" oninput="GoldAI.updateTradeSettings()" />
          </div>
        </div>
        <button class="btn-ghost" style="margin-top:8px;" onclick="GoldAI.applyTradeSettings()">✅ اعمال تنظیمات</button>
      </div>

      <!-- کارت ریسک و وین‌ریت -->
      <div class="card risk-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="margin:0;">💰 ریسک و عملکرد</h3>
          <button class="btn-icon" onclick="GoldAI.openSettings()">⚙️</button>
        </div>
        <div class="risk-row">
          <span>سرمایه</span><b id="capitalText">10000</b>
          <span>ریسک</span><b id="riskText">1%</b>
          <span>حد ضرر ($)</span><b id="maxLossText">100</b>
          <span>لات</span><b id="lotText">0.01</b>
        </div>
        <div class="winrate-row">
          <span>وین‌ریت امروز: <b id="dailyWinRate">—</b></span>
          <span>سود احتمالی: <b id="dailyProfit">$0.00</b></span>
          <span>ضرر احتمالی: <b id="dailyLoss">$0.00</b></span>
        </div>
      </div>

      <!-- دکمه‌های ابزار -->
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <button class="btn-ghost" style="flex:1; margin:0;" onclick="GoldAI.runBacktest()">📊 بک‌تست</button>
        <button class="btn-ghost" style="flex:1; margin:0;" onclick="GoldAI.showPanel('performance')">📈 عملکرد</button>
        <button class="btn-ghost" style="flex:1; margin:0;" onclick="GoldAI.showPanel('details')">📊 جزئیات</button>
      </div>

      <!-- نتیجه بک‌تست -->
      <div id="backtestResult" class="card hidden">
        <h3>📊 نتیجه بک‌تست</h3>
        <div id="backtestSummary"></div>
      </div>
    </div>

    <!-- ===== سایر پنل‌ها (مثل قبل) ===== -->
    <div id="panel-details" class="panel hidden"><!-- جزئیات --></div>
    <div id="panel-performance" class="panel hidden"><!-- عملکرد --></div>
    <div id="panel-about" class="panel hidden"><!-- درباره --></div>

    <!-- ناوبری -->
    <nav class="nav">
      <button class="nav-btn active" data-panel="home" onclick="GoldAI.showPanel('home')">🏠</button>
      <button class="nav-btn" data-panel="details" onclick="GoldAI.showPanel('details')">📊</button>
      <button class="nav-btn" data-panel="performance" onclick="GoldAI.showPanel('performance')">📈</button>
      <button class="nav-btn" data-panel="about" onclick="GoldAI.showPanel('about')">ℹ️</button>
    </nav>

  </div>

  <script src="js/config.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/ema.js"></script>
  <script src="js/engines/rsi.js"></script>
  <script src="js/engines/divergence.js"></script>
  <script src="js/engines/market-structure.js"></script>
  <script src="js/engines/macd.js"></script>
  <script src="js/engines/adx.js"></script>
  <script src="js/engines/atr.js"></script>
  <script src="js/engines/volume.js"></script>
  <script src="js/engines/support-resistance.js"></script>
  <script src="js/engines/candles.js"></script>
  <script src="js/engines/liquidity.js"></script>
  <script src="js/engines/fundamental.js"></script>
  <script src="js/engines/correlation.js"></script>
  <script src="js/engines/ai-brain.js"></script>
  <script src="js/engines/score.js"></script>
  <script src="js/engines/conflict-filter.js"></script>
  <script src="js/engines/trade-management.js"></script>
  <script src="js/app.js"></script>
  <script src="js/speed-patch.js"></script>
</body>
</html>
